on: push

jobs:
  cs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: PHPCS
      run: |
        composer install
        composer phpcs-github
    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v6
      if: always() # always run even if the previous step fails
      with:
        report_paths: '**/build/test-results/*.xml'
        detailed_summary: true
        check_name: PHPCS Report

  eslint:
    name: ESLINT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The runner's preinstalled Node is too old for the eslint 10 / vitest 4 /
      # jsdom 29 engine ranges. actions/checkout's own runtime doesn't change
      # the Node that `npm` runs under.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # package-lock.json is generated in the premium repo and copied here by
      # its build-free.sh, so this installs the same pinned tree (eslint 10.4.1).
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run ESLint
        run: npx eslint assets/js
          --config eslint.config.js
        continue-on-error: true


  md:
    name: PHPMD
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: PHPMD
      run: |
        composer install
        composer phpmd-github
